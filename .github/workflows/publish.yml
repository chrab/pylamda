# Build pylamda and publish it on TestPyPI, with digital attestations (PEP 740).
#
# Runs when a tag v<version> is pushed, e.g. v0.1.0b3. The tag must match the version
# in pyproject.toml. Uploads use Trusted Publishing (no token): TestPyPI must list this
# repository, this workflow (publish.yml) and the environment "testpypi" as a publisher.
# pypa/gh-action-pypi-publish creates and uploads the attestations by default.

name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the version ${version} in pyproject.toml"
            exit 1
          fi
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pylamda
    permissions:
      id-token: write  # Trusted Publishing and attestations
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
